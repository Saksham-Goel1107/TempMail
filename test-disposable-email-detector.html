<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TempMail Detector Test</title>
    <!-- Prism.js for syntax highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    <link rel="stylesheet" href="styles/test-disposable-email-detector.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="top-bar">
                <div class="logo-section">
                    <div class="logo">TEMPMAIL PRO</div>
                    <a href="/" class="back-btn" title="Back to Home">
                        <span>←</span> Home
                    </a>
                </div>
                <button class="theme-toggle" id="theme-toggle" title="Toggle Dark Mode" aria-label="Toggle between light and dark theme">
                    🌙
                </button>
            </div>
            <h1>🛡️ TempMail Detector</h1>
            <p>Test if an email address is from a temporary/disposable email service</p>
        </div>

        <div class="input-group">
            <input type="email" id="emailInput" class="email-input" placeholder="Enter email address (e.g., test@temp-mail.org)" required>
            <button id="checkBtn" class="check-btn">🔍 Check Email</button>
        </div>

        <div class="docs-link">
            <a href="/docs-disposable-email-detector" class="btn-secondary">📖 View Full API Documentation</a>
        </div>

        <div id="result" class="result"></div>

        <div class="examples">
            <h4>Try these examples:</h4>
            <div class="example-list">
                <button class="example-btn" onclick="setExample('user@temp-mail.org')">user@temp-mail.org</button>
                <button class="example-btn" onclick="setExample('test@10minutemail.com')">test@10minutemail.com</button>
                <button class="example-btn" onclick="setExample('example@gmail.com')">example@gmail.com</button>
                <button class="example-btn" onclick="setExample('demo@outlook.com')">demo@outlook.com</button>
            </div>
        </div>
    </div>

    <script src="scripts/test-disposable-email-detector.js">
    </script>
    <script src="scripts/google-translate.js"></script>
</body>
</html>
